services:
  postgres:
    image: postgres:15-alpine
    container_name: saas_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - saas_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: saas_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"   
      - "15672:15672" 
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    networks:
      - saas_net

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - saas_net

  s3:
    image: localstack/localstack:3.8.0 
    container_name: saas_s3
    restart: always
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=${AWS_DEFAULT_REGION}
    ports:
      - "4566:4566"
    volumes:
      - s3_data:/var/lib/localstack
    networks:
      - saas_net
  
  prometheus:
    image: prom/prometheus:latest
    container_name: saas_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml 
      - prometheus_data:/prometheus
    networks:
      - saas_net

  grafana:
    image: grafana/grafana:latest
    container_name: saas_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=senha_segura_123
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - saas_net

# Define a rede interna neutra
networks:
  saas_net:
    driver: bridge

# Define a persistência dos dados
volumes:
  pg_data:
  rabbit_data:
  redis_data:
  s3_data:
  prometheus_data:
  grafana_data: